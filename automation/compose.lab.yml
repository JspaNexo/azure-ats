# Persistent local laboratory. The CD script copies this file and its mounts
# outside the agent checkout. Application images have already passed CI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ATS_POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ats_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ats_db"]
      interval: 3s
      timeout: 5s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ATS_KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${ATS_POSTGRES_PASSWORD:?Required}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${ATS_BACKEND_IMAGE:?Required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ats_db;Username=postgres;Password=${ATS_POSTGRES_PASSWORD:?Required}
      Storage__BasePath: /app/Storage
      Gemini__ApiKey: ""
      Gemini__UseMockData: "true"
      Authentication__Authority: http://keycloak:8080/realms/ats-realm
      Authentication__ValidIssuer: http://localhost:18085/realms/ats-realm
      Authentication__Audience: ats-backend
    volumes:
      - backend_storage:/app/Storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${ATS_FRONTEND_IMAGE:?Required}
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
